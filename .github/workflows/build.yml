name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Zed has no published eval-cli release asset, so build it from source with
  # their own Dockerfile. Bump this to move to a newer Zed commit.
  ZED_REF: a84689073d296dfd39987bc7dd478e43ef76d83a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ env.ZED_REF }}
          path: zed

      - uses: actions/checkout@v4
        with:
          path: ci
          clean: false

      - name: Patch eval-cli
        working-directory: zed
        run: python3 ../ci/patch_eval_cli.py .

      - name: Build eval-cli
        working-directory: zed
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f crates/eval_cli/Dockerfile -t eval-cli-builder .
          cid=$(docker create eval-cli-builder /eval-cli)
          mkdir -p out
          docker cp "$cid":/eval-cli out/eval-cli
          docker rm "$cid"
          chmod +x out/eval-cli
          ls -lh out/eval-cli

      - uses: actions/upload-artifact@v4
        with:
          name: eval-cli-linux-x86_64
          path: zed/out/eval-cli
          if-no-files-found: error

  # Workflow artifacts expire after 90 days; release assets do not.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          clean: false

      - uses: actions/download-artifact@v4
        with:
          name: eval-cli-linux-x86_64
          path: out

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZED_REF: ${{ env.ZED_REF }}
        run: |
          set -euo pipefail
          chmod +x out/eval-cli
          sha=$(sha256sum out/eval-cli | cut -d' ' -f1)
          notes=$(printf 'eval-cli built from `zed-industries/zed@%s` with `patch_eval_cli.py`.\n\nsha256 `%s`\n' "$ZED_REF" "$sha")
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/eval-cli --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title 'eval-cli (rolling)' --notes "$notes" out/eval-cli
          fi